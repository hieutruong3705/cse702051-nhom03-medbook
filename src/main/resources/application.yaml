spring:
  application:
    name: medbook

  datasource:
    url: jdbc:h2:mem:medbook_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  flyway:
    enabled: false

server:
  port: ${PORT:8080}

logging:
  level:
    org.hibernate.SQL: DEBUG

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:MedBookSecretKey2024VeryLongSecureKeyForHS256AlgorithmAtLeast256Bits!!}
  expiration-ms: ${JWT_EXPIRATION:900000}

# File upload limit (10MB)
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
