spring:
  application:
    name: medbook

  datasource:
    url: jdbc:mysql://localhost:3306/medbook_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update                             # ← Tự sinh/cập nhật bảng
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true          # Chạy data.sql SAU khi Hibernate tạo bảng

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql           # Chỉ nạp data, không nạp schema

  flyway:
    enabled: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG