spring:
  application:
    name: medbook

  # Tạm chạy trang chào không cần database, kể cả khi dùng profile docker.
  # Xóa mục exclude này khi bắt đầu sử dụng JPA/MySQL.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medbook_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update                             # ← Tự sinh/cập nhật bảng
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true          # Chạy data.sql SAU khi Hibernate tạo bảng

  sql:
    init:
      mode: never
      data-locations: classpath:data.sql           # Chỉ nạp data, không nạp schema

  flyway:
    enabled: false

server:
  port: ${PORT:8080}

logging:
  level:
    org.hibernate.SQL: DEBUG
