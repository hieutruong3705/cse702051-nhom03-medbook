# Cấu hình mặc định = chế độ phát triển: H2 trong bộ nhớ, tự tạo bảng, nạp dữ liệu mẫu data-h2.sql.
# Các môi trường khác chọn bằng SPRING_PROFILES_ACTIVE: docker, prod (MySQL + Flyway), online, v4mysql (nghiệm thu).
spring:
  application:
    name: medbook

  datasource:
    url: jdbc:h2:mem:medbook_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      platform: h2
      # Chỉ H2 nạp tệp này (có lệnh RESTART WITH của H2). MySQL dùng Flyway và db/seed/demo-seed.sql.
      data-locations: classpath:data-h2.sql

  flyway:
    enabled: false

server:
  port: ${PORT:8080}
  # Nén phản hồi văn bản từ 1 KB trở lên (trang, CSS, JS, JSON, SVG). Ảnh và phông chữ đã nén sẵn nên không nén lại.
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1024
  error:
    # Không bao giờ đưa stack trace, tên ngoại lệ hay thông điệp nội bộ vào phản hồi lỗi.
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

logging:
  # Mỗi dòng log mang mã của yêu cầu (X-Request-Id) để đối chiếu với trường requestId trong thân lỗi.
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    org.hibernate.SQL: DEBUG

# JWT: khóa ký lấy từ biến môi trường JWT_SECRET. Để trống ở máy phát triển thì ứng dụng tự sinh khóa ngẫu nhiên
# cho mỗi lần chạy (xem JwtSecretProvider). Hồ sơ docker, prod, online bắt buộc đặt JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION:900000}

# Giới hạn tệp tải lên (10MB)
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

# Tài liệu OpenAPI: mặc định tắt. Bật bằng MEDBOOK_OPENAPI_ENABLED=true (xem /v3/api-docs và /swagger-ui.html).
medbook:
  openapi:
    enabled: ${MEDBOOK_OPENAPI_ENABLED:false}
  clinic:
    # Thông tin giới thiệu phòng khám trên trang /about. Đây là dữ liệu MÔ PHỎNG phục vụ học tập, không phải phòng
    # khám thật; đổi qua biến môi trường nếu cần. Giờ làm việc: nhiều dòng phân tách bằng dấu chấm phẩy.
    name: "${MEDBOOK_CLINIC_NAME:Phòng khám đa khoa MedBook}"
    introduction: "${MEDBOOK_CLINIC_INTRODUCTION:MedBook là phòng khám đa khoa ngoại trú mô phỏng của Nhóm 03, học phần Thiết kế web nâng cao. Người bệnh xem thông tin bác sĩ, chọn dịch vụ và đặt lịch khám trực tuyến, xem kết quả khám, đơn thuốc và hóa đơn của chính mình.}"
    address: "${MEDBOOK_CLINIC_ADDRESS:Số 1 Đường Mô Phỏng, Phường Học Tập, Hà Nội}"
    phone: "${MEDBOOK_CLINIC_PHONE:0240 000 0000}"
    email: "${MEDBOOK_CLINIC_EMAIL:lienhe@medbook.example}"
    working-hours: "${MEDBOOK_CLINIC_WORKING_HOURS:Thứ Hai đến Thứ Sáu: 07:30 - 17:00;Thứ Bảy: 07:30 - 11:30;Chủ nhật và ngày lễ: nghỉ}"
  admin:
    # Mật khẩu ban đầu của admin1, admin2, admin3. Chỉ được dùng khi CSDL chưa có tài khoản nào (InitialAdminRunner);
    # để trống thì không tạo tài khoản. Áp dụng cho mọi hồ sơ.
    initial-password: ${MEDBOOK_ADMIN_INITIAL_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${medbook.openapi.enabled}
  swagger-ui:
    enabled: ${medbook.openapi.enabled}
  paths-to-match: /api/v1/**
