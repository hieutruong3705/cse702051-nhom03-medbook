spring:
  datasource:
    url: jdbc:mysql://db:3306/medbook_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root                     # Mật khẩu khớp với docker-compose.yml
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  sql:
    init:
      mode: never                      # Docker đã nạp schema + data qua MySQL container