# Hồ sơ docker: chạy bằng docker compose với MySQL 8. Lược đồ do Flyway quản lý, Hibernate chỉ kiểm tra (validate).
# Mọi bí mật lấy từ biến môi trường (tệp .env, xem .env.example). Thiếu JWT_SECRET thì ứng dụng không khởi động.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/medbook_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # false: Flyway phải chạy TRƯỚC khi Hibernate kiểm tra lược đồ. (Bản mặc định đặt true để H2 nạp data-h2.sql
    # sau khi Hibernate tạo bảng; để nguyên true thì Hibernate validate trước Flyway và báo thiếu bảng.)
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: UTC

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    # CSDL đã có bảng nhưng chưa có lịch sử Flyway (volume dựng từ bản cũ bằng ddl-auto=update): coi như đang ở
    # V1 và chỉ chạy các bản từ V2, vốn chỉ cộng thêm và chạy lại được.
    baseline-on-migrate: true
    baseline-version: 1

  devtools:
    restart:
      enabled: false

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}

medbook:
  upload-dir: ${MEDBOOK_UPLOAD_DIR:/app/uploads}
  cors:
    allowed-origins: ${MEDBOOK_CORS_ALLOWED_ORIGINS:http://localhost:8080}
  seed:
    # true: nạp tài khoản và dữ liệu demo một lần khi CSDL còn trống (xem DemoSeedRunner).
    demo: ${MEDBOOK_SEED_DEMO:false}

logging:
  level:
    org.hibernate.SQL: WARN
