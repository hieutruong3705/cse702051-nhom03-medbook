# Dedicated online acceptance environment; all credentials supplied by the host.
spring:
  datasource:
    url: ${MEDBOOK_DB_URL}
    username: ${MEDBOOK_DB_USER}
    password: ${MEDBOOK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: ${MEDBOOK_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: false
server:
  forward-headers-strategy: framework
jwt:
  secret: ${JWT_SECRET}
logging:
  level:
    org.hibernate.SQL: WARN
