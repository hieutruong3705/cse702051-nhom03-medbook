<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            font-family: system-ui, sans-serif;
            color: #163047;
            background: #f0f7fa;
        }

        main {
            flex: 1;
            display: grid;
            place-content: center;
            padding: 32px 20px;
            text-align: center;
        }

        .brand {
            margin: 0;
            color: #087568;
            font-weight: 700;
            font-size: 24px;
        }

        h1 {
            margin: 16px 0;
            font-size: clamp(40px, 8vw, 72px);
        }

        .description {
            max-width: 560px;
            margin: 0 auto;
            font-size: 20px;
            line-height: 1.6;
        }

        footer {
            padding: 24px 20px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        footer p {
            margin: 4px 0;
        }

</head>

<body>
    <main>
        <p class="brand">MedBook</p>
        <h1>hello word</h1>
        <p class="description">Hệ thống quản lý bệnh án và đặt lịch khám bệnh.</p>

    <footer>
