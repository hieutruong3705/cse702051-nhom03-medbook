# Isolated local acceptance database. Credentials supplied by the launch environment.
spring:
  datasource:
    url: ${MEDBOOK_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MEDBOOK_DB_USER:root}
    password: ${MEDBOOK_DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: UTC
  sql:
    init:
      mode: never
logging:
  level:
    org.hibernate.SQL: WARN
