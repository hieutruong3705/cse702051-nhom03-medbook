# Chỉ dùng cho test: mỗi Spring context có một DB H2 riêng để data-h2.sql (ID cố định)
# không bị chạy lại trên cùng một DB khi có nhiều context được tạo trong một JVM.
spring.datasource.url=jdbc:h2:mem:medbook_test_${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Thư mục lưu tệp đính kèm khi test (xóa theo target/)
medbook.upload-dir=target/test-uploads

# Tác vụ nhắc lịch không tự chạy nền khi test (các test gọi thẳng AppointmentReminderJob.remindDue với
# thời điểm do test chọn), để nó không tạo thông báo cho lịch hẹn của test khác.
medbook.reminders.enabled=false

# Mọi test dùng chung địa chỉ 127.0.0.1 và cố ý đăng nhập sai rất nhiều lần, nên giới hạn tần suất theo IP được nới
# rộng ở đây; LoginRateLimitTest tự đặt ngưỡng thấp để kiểm chứng mã 429.
medbook.security.login-rate-limit.max-failures=1000000

# Nhiều test ghi thẳng danh mục vào CSDL rồi đọc lại qua API công khai, nên bộ nhớ đệm danh mục tắt ở đây;
# PublicCatalogCacheTest tự bật để kiểm chứng.
medbook.cache.enabled=false
