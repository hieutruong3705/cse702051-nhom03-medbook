# Chỉ dùng cho test: mỗi Spring context có một DB H2 riêng để data.sql (ID cố định)
# không bị chạy lại trên cùng một DB khi có nhiều context được tạo trong một JVM.
spring.datasource.url=jdbc:h2:mem:medbook_test_${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Thư mục lưu tệp đính kèm khi test (xóa theo target/)
medbook.upload-dir=target/test-uploads
