# MedBook: MySQL 8 + ứng dụng (+ phpMyAdmin khi cần).
#
#   Copy-Item .env.example .env      # rồi sửa giá trị trong .env (bắt buộc: MYSQL_ROOT_PASSWORD, JWT_SECRET)
#   docker compose up --build -d
#   docker compose --profile database up -d    # thêm phpMyAdmin
#
# Không có mật khẩu hay khóa nào viết sẵn ở đây: thiếu biến bắt buộc thì compose dừng và nêu tên biến.
# KHÔNG chạy "docker compose down -v": tùy chọn -v xóa volume db_data (toàn bộ CSDL) và uploads (tệp đính kèm).
services:

  db:
    image: mysql:8.0
    container_name: ${MEDBOOK_CONTAINER_PREFIX:-medbook}-db
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD - hãy tạo tệp .env từ .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medbook_db}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # $$ để biến được đọc bên trong container, mật khẩu không nằm trong cấu hình compose đã phân giải
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - medbook-network

  app:
    build: .
    container_name: ${MEDBOOK_CONTAINER_PREFIX:-medbook}-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-medbook_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD - hãy tạo tệp .env từ .env.example}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET - hãy tạo tệp .env từ .env.example và đặt một chuỗi ngẫu nhiên từ 32 ký tự}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      MEDBOOK_UPLOAD_DIR: /app/uploads
      MEDBOOK_CORS_ALLOWED_ORIGINS: ${MEDBOOK_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      MEDBOOK_SEED_DEMO: ${MEDBOOK_SEED_DEMO:-false}
      MEDBOOK_SEED_ACTIVITY: ${MEDBOOK_SEED_ACTIVITY:-${MEDBOOK_SEED_DEMO:-false}}
      MEDBOOK_OPENAPI_ENABLED: ${MEDBOOK_OPENAPI_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
    networks:
      - medbook-network

  phpmyadmin:
    profiles: [database]
    image: phpmyadmin:latest
    container_name: ${MEDBOOK_CONTAINER_PREFIX:-medbook}-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - medbook-network

volumes:
  db_data:
    driver: local
  uploads:
    driver: local

networks:
  medbook-network:
    driver: bridge
