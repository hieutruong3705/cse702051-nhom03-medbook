<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống MedBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hệ Thống Quản Lý MedBook</h1>

        <!-- KHUNG 1: ĐĂNG NHẬP (MẶC ĐỊNH HIỂN THỊ) -->
        <div id="login-card" class="card">
            <h2>Đăng Nhập</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Tên đăng nhập</label>
                    <input type="text" id="login-username" required placeholder="Nhập tên đăng nhập">
                </div>
                <div class="form-group">
                    <label for="login-password">Mật khẩu</label>
                    <input type="password" id="login-password" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn-primary">Đăng Nhập</button>
            </form>
            <p class="switch-text">Chưa có tài khoản? <a href="#" id="show-register">Đăng ký ngay</a></p>
        </div>

        <!-- KHUNG 2: ĐĂNG KÝ (ẨN MẶC ĐỊNH) -->
        <div id="register-card" class="card hidden">
            <h2>Đăng Ký Tài Khoản</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-fullname">Họ và Tên</label>
                    <input type="text" id="reg-fullname" required placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label for="reg-username">Tên đăng nhập</label>
                    <input type="text" id="reg-username" required placeholder="Nhập tên đăng nhập">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Mật khẩu</label>
                    <input type="password" id="reg-password" required placeholder="Nhập mật khẩu">
                </div>
                <div class="form-group">
                    <label for="reg-role">Chức vụ / Vai trò</label>
                    <select id="reg-role" class="form-select" required>
                        <option value="PATIENT">Bệnh nhân</option>
                        <option value="DOCTOR">Bác sĩ</option>
                        <option value="ADMIN">Quản trị viên</option>
                    </select>
                </div>
                <button type="submit" class="btn-success">Đăng Ký</button>
            </form>
            <p class="switch-text">Đã có tài khoản? <a href="#" id="show-login">Quay lại Đăng nhập</a></p>
        </div>

        <!-- KHUNG 3: TRANG CHỦ / DASHBOARD SAU KHU ĐĂNG NHẬP -->
        <div id="dashboard-card" class="card hidden">
            <h2>Trang Quản Lý MedBook</h2>
            <div class="user-info">
                <p>Xin chào, <strong id="user-display-name">---</strong>!</p>
                <p>Chức vụ: <span id="user-display-role" class="badge">---</span></p>
            </div>
            <button id="logout-btn" class="btn-danger">Đăng Xuất</button>
        </div>

        <!-- THÔNG BÁO LỖI / THÀNH CÔNG -->
        <div id="message-box" class="alert hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
