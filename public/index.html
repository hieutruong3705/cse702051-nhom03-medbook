<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBook - Quản Lý Y Tế</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hệ Thống MedBook</h1>
        
        <!-- Form Đăng Ký -->
        <div class="card">
            <h2>Đăng Ký Tài Khoản</h2>
            <form id="registerForm">
                <input type="text" id="regFullName" placeholder="Họ và tên" required>
                <input type="text" id="regUsername" placeholder="Tên đăng nhập" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Mật khẩu" required>
                <button type="submit">Đăng Ký</button>
            </form>
        </div>

        <!-- Form Đăng Nhập -->
        <div class="card">
            <h2>Đăng Nhập</h2>
            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Tên đăng nhập" required>
                <input type="password" id="loginPassword" placeholder="Mật khẩu" required>
                <button type="submit">Đăng Nhập</button>
            </form>
        </div>

        <div id="message" class="message"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
